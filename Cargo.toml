[package]
name = "mavra"
version = "0.1.0"
edition = "2021"
authors = ["Tai Ming", "Zhanhao Zhao"]
description = "MAVRA: Sharing and Maintaining Executable Knowledge for Data Agents"
license = "Apache-2.0"
repository = "https://github.com/mmmttt000045/MAVRA"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
dotenvy = "0.15"
futures = "0.3"
parking_lot = "0.12"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "=0.53.0", features = ["visitor"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"

[profile.release]
debug = false
opt-level = 2
