name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "python3 -m pip install -r tools/relbench/requirements-test.txt"
      - run: "python3 tools/experiment-index.py --check"
      - run: "python3 -m unittest discover -s tools/relbench -p 'test_*.py'"
      - run: "python3 -m unittest discover -s exp/mechanism-studies"

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: "cargo fmt --check"
      - run: "cargo test --locked"
      - run: "cargo clippy --locked --all-targets -- -D warnings"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mock-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAVRA_TEST_DB_URL: postgres://postgres:mock-ci-password@127.0.0.1:5432/postgres
      AGENTDB_TEST_URL: postgres://postgres:mock-ci-password@127.0.0.1:5432/postgres
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: "cargo test --locked integration_tests:: -- --ignored --test-threads=1"
